# Publie le zip de l'add-on dans une release GitHub à chaque tag vX.Y.Z
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version de addon.xml
        run: |
          version=$(python3 build.py --version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à addon.xml (v$version)"
            exit 1
          fi

      - name: Construire le zip
        run: echo "ZIP=$(python3 build.py)" >> "$GITHUB_ENV"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
